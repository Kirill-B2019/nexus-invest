<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UIcons - Все иконки (fi-rr-)</title>
    <link rel="stylesheet" href="assets/css/vendors/uicons-regular-rounded.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 30px;
            min-height: 100vh;
        }
        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #C5FF41;
        }
        .subtitle {
            text-align: center;
            margin-bottom: 30px;
            color: #888;
        }
        .search-box {
            max-width: 400px;
            margin: 0 auto 30px;
        }
        .search-box input {
            width: 100%;
            padding: 12px 20px;
            font-size: 16px;
            border: 2px solid #333;
            border-radius: 30px;
            background: #252540;
            color: #fff;
            outline: none;
            transition: border-color 0.3s;
        }
        .search-box input:focus {
            border-color: #C5FF41;
        }
        .icons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
        }
        .icon-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
            background: #252540;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }
        .icon-item:hover {
            background: #2d2d50;
            border-color: #C5FF41;
            transform: translateY(-3px);
        }
        .icon-item i {
            font-size: 32px;
            margin-bottom: 12px;
            color: #C5FF41;
        }
        .icon-item .icon-name {
            font-size: 11px;
            color: #aaa;
            text-align: center;
            word-break: break-all;
            line-height: 1.3;
        }
        .icon-item .icon-class {
            font-size: 10px;
            color: #666;
            margin-top: 5px;
            font-family: monospace;
        }
        .icon-item.copied {
            background: #3B4725;
            border-color: #C5FF41;
        }
        .icon-item.copied::after {
            content: 'Скопировано!';
            position: absolute;
            font-size: 10px;
            color: #C5FF41;
        }
        .count {
            text-align: center;
            margin-bottom: 20px;
            color: #666;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #C5FF41;
            color: #1a1a2e;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            opacity: 0;
            transition: all 0.3s;
            z-index: 1000;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>
    <h1>UIcons Regular Rounded</h1>
    <p class="subtitle">Нажмите на иконку, чтобы скопировать класс</p>
    
    <div class="search-box">
        <input type="text" id="search" placeholder="Поиск иконок..." autocomplete="off">
    </div>
    
    <p class="count">Всего иконок: <span id="total">498</span> | Показано: <span id="shown">498</span></p>

    </div>

            'wifi-alt', 'wind', 'woman-head', 'world', 'yen', 'zoom-in', 'zoom-out'
        ];

        const grid = document.getElementById('icons-grid');
        const searchInput = document.getElementById('search');
        const shownCount = document.getElementById('shown');
        const toast = document.getElementById('toast');

        function renderIcons(filter = '') {
            const filtered = icons.filter(icon => icon.includes(filter.toLowerCase()));
            shownCount.textContent = filtered.length;
            
            grid.innerHTML = filtered.map(icon => `
                <div class="icon-item" data-class="fi-rr-${icon}" onclick="copyClass(this)">
                    <i class="fi-rr-${icon}"></i>
                    <span class="icon-name">${icon}</span>
                    <span class="icon-class">fi-rr-${icon}</span>
                </div>
            `).join('');
        }

        function copyClass(el) {
            const className = el.dataset.class;
            navigator.clipboard.writeText(className).then(() => {
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 1500);
            });
        }

        searchInput.addEventListener('input', (e) => {
            renderIcons(e.target.value);
        });

        renderIcons();
    </script>
</body>
</html>
